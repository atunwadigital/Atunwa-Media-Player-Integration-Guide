buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // The Atunwa Media SDK, and the AdsWizz SDK it uses. Public, no credentials.
        maven {
            url "https://raw.githubusercontent.com/atunwadigital/Atunwa-Media-Player-Integration-Guide/maven"
            content {
                includeGroup "com.atunwadigital"
                includeGroup "com.adswizz"
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
